spring.application.name=productService
server.port=${SERVER_PORT:8080}

# Drenado de conexiones en vuelo: k8s/Compose mandan SIGTERM y el pod viejo
# termina sus requests antes de morir (ver preStop + terminationGracePeriodSeconds
# en k8s/apps/base/*).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# El seeder usa JDBC batch directo; estos dos ajustes benefician también las
# escrituras JPA normales con el mismo tamaño de lote.
spring.jpa.properties.hibernate.jdbc.batch_size=${SEEDER_BATCH_SIZE:500}
spring.jpa.properties.hibernate.order_inserts=true

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.tags.service=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash

# Storage de imágenes: Azure Blob Storage en producción / Azurite en local
# (k8s/apps/base/product-service/configmap.yaml define el valor por entorno).
# Sin default de key: vacío ⇒ el bean arranca con storage deshabilitado, lo
# que permite correr los tests sin credenciales. En k8s el secretKeyRef de
# AZURE_STORAGE_KEY lo exige igual (deploy.sh valida la presencia de la clave).
app.storage.endpoint=${AZURE_STORAGE_ENDPOINT:http://localhost:10000/devstoreaccount1}
app.storage.account=${AZURE_STORAGE_ACCOUNT:devstoreaccount1}
app.storage.key=${AZURE_STORAGE_KEY:}
app.storage.container=${AZURE_STORAGE_CONTAINER:productos}

# Upload de imágenes del admin: 5 MB por archivo, 10 MB por petición.
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_REQUEST_SIZE:10MB}

# Database seeder (independiente por microservicio; deshabilitado por defecto).
# Solo se activa con SEEDER_ENABLED=true Y un perfil de la lista permitida.
seeder.enabled=${SEEDER_ENABLED:false}
seeder.count=${SEEDER_COUNT:1000}
seeder.batch-size=${SEEDER_BATCH_SIZE:500}
seeder.random-seed=${SEEDER_RANDOM_SEED:12345}
seeder.clean-before-run=${SEEDER_CLEAN_BEFORE_RUN:false}
seeder.allow-clean=${SEEDER_ALLOW_CLEAN:false}
seeder.allowed-profiles=${SEEDER_ALLOWED_PROFILES:dev,test,local}
seeder.include-infra=${SEEDER_INCLUDE_INFRA:false}
seeder.external-id-prefix=${SEEDER_EXTERNAL_ID_PREFIX:SEED}
seeder.external-id-base=${SEEDER_EXTERNAL_ID_BASE:9000000}
seeder.marker-enabled=${SEEDER_MARKER_ENABLED:true}
