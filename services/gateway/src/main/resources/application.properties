spring.application.name=gateway
# 8081: Authorizer (runtime/docker/compose.yaml) ya publica 127.0.0.1:8080,
# así que el gateway no puede usar el puerto por defecto en dev local.
server.port=${SERVER_PORT:8081}

# Drenado de conexiones en vuelo: k8s/Compose mandan SIGTERM y el pod viejo
# termina sus requests antes de morir (ver preStop + terminationGracePeriodSeconds
# en k8s/apps/base/*).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.instance.prefer-ip-address=true

# Authorizer (runtime/docker/compose.yaml) expone la API REST pública en /v1/*:
# /api/auth/login -> POST /v1/login, /api/auth/signup -> POST /v1/signup.
# No es lb://: Authorizer no registra en Eureka. En Docker se sobreescribe con
# AUTHORIZER_BASE_URL=http://authorizer:8080.
spring.cloud.gateway.server.webmvc.routes[0].id=auth
spring.cloud.gateway.server.webmvc.routes[0].uri=${AUTHORIZER_BASE_URL:http://127.0.0.1:8080}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=RewritePath=/api/auth/(?<segment>.*),/v1/${segment}

spring.cloud.gateway.server.webmvc.routes[1].id=products
spring.cloud.gateway.server.webmvc.routes[1].uri=${PRODUCT_SERVICE_BASE_URL:lb://productService}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/products/**,/api/categories/**

spring.cloud.gateway.server.webmvc.routes[2].id=orders
spring.cloud.gateway.server.webmvc.routes[2].uri=${ORDER_SERVICE_BASE_URL:lb://orderService}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webmvc.routes[3].id=payments
spring.cloud.gateway.server.webmvc.routes[3].uri=${PAYMENT_SERVICE_BASE_URL:lb://paymentService}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.server.webmvc.routes[4].id=webhooks
spring.cloud.gateway.server.webmvc.routes[4].uri=${PAYMENT_SERVICE_BASE_URL:lb://paymentService}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/webhooks/**

spring.http.clients.connect-timeout=${GATEWAY_CONNECT_TIMEOUT_MS:2000}
spring.http.clients.read-timeout=${GATEWAY_READ_TIMEOUT_MS:10000}

# Obligatorias: el decoder valida firma (HS256) y issuer contra Authorizer.
# En dev: JWT_SECRET=AUTHORIZER_JWT_SECRET y JWT_ISSUER=AUTHORIZER_URL (mismo .env).
jwt.secret=${JWT_SECRET}
jwt.issuer=${JWT_ISSUER}

# Default restrictivo (fail-closed): local sobrescribe con "*" (compose/configmap base)
# y producción con el dominio exacto del frontend (configMapGenerator del overlay).
gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
gateway.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
gateway.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Correlation-Id}
gateway.cors.allow-credentials=true
gateway.cors.max-age=PT1H

gateway.limits.max-request-size=${GATEWAY_MAX_REQUEST_SIZE:1048576}

gateway.ratelimit.default-capacity=60
gateway.ratelimit.default-refill-tokens=60
gateway.ratelimit.default-refill-interval=PT1M
gateway.ratelimit.routes.auth.capacity=10
gateway.ratelimit.routes.auth.refill-tokens=10
gateway.ratelimit.routes.auth.refill-interval=PT1M
gateway.ratelimit.excluded-paths=/api/webhooks/**,/actuator/**

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.tags.service=${spring.application.name}
management.endpoint.health.probes.enabled=true
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash
